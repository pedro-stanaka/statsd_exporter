version: '3.7'

services:
  prometheus:
    image: prom/prometheus:latest
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    ports:
      - "9090:9090"
    volumes:
      - './config/prometheus.yml:/etc/prometheus/prometheus.yml:cached'

  dd-agent:
    image: 'gcr.io/datadoghq/agent:7'
    env_file: .env
    logging:
      driver: none

